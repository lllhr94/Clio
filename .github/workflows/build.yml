# Builds Clio: tests the engine (AgentKit), then the SwiftUI app (App).
# Produces an unsigned IPA; signing happens on the phone.

name: Build

# Built only when asked. A build checks that everything compiles; only a build with publish on replaces the
# latest IPA, and that happens once every task of a version is green (section 13.5 of the plan).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (macos-latest, or macos-15-intel when the arm64 machines are busy)
        default: macos-latest
      publish:
        description: "Publish the IPA: on main it replaces latest/Clio-unsigned.ipa; on another branch it goes to a probe-<branch> release"
        type: boolean
        default: false
      shots:
        description: "Also build for the simulator and take screenshots of the main screens (light and dark)"
        type: boolean
        default: false
      shot_model_error:
        description: "When taking screenshots, capture the model error card in both tones"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Clio (iOS, unsigned)
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
        working-directory: App
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Test the engine (AgentKit)
        working-directory: AgentKit
        run: |
          set -o pipefail
          swift test 2>&1 | tail -n 80

      - name: Reuse 斗室 built before
        uses: actions/cache@v4
        with:
          path: |
            App/Den/build/ios
            App/Den/build/rootfs
            App/Den/ish-src
          key: den-${{ hashFiles('App/Den/build-ish.sh') }}

      - name: Build 斗室 (iSH ARM64 kernel + Alpine root)
        run: bash Den/build-ish.sh

      - name: Generate the Xcode project
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Clio.xcodeproj \
            -scheme Clio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -iE "error|failed|BUILD|undefined|not found" | grep -v "^\s*$" | tail -n 150

      - name: Package the IPA
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::没有找到 .app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCalendarsFullAccessUsageDescription' "$APP/Info.plist"
          test -f "$APP/alpine/meta.db" || { echo "::error::斗室的 Linux 没有打进包里"; exit 1; }
          du -sh "$APP" "$APP/alpine"
          # A probe branch can carry entitlements (App/Clio.entitlements, App/ClioWidget.entitlements); sign ad hoc so they
          # travel inside the binaries. Extensions first, each with its own, then the app around them.
          if [ -f ClioWidget.entitlements ] && [ -d "$APP/PlugIns/ClioWidget.appex" ]; then
            codesign --force --sign - --entitlements ClioWidget.entitlements --timestamp=none "$APP/PlugIns/ClioWidget.appex"
          fi
          if [ -f Clio.entitlements ]; then
            codesign --force --sign - --entitlements Clio.entitlements --timestamp=none "$APP"
            codesign -d --entitlements - "$APP" || true
          fi
          ls "$APP/PlugIns" 2>/dev/null || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Clio-unsigned.ipa Payload
          ls -lh Clio-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Clio-unsigned-ipa
          path: App/Clio-unsigned.ipa
          if-no-files-found: error

      # Pictures of the main screens, to check the look without a phone.
      - name: Screenshots (simulator)
        if: inputs.shots
        continue-on-error: true
        env:
          SHOT_MODEL_ERROR: ${{ inputs.shot_model_error }}
          SWIFTTERM_BUILD_BRANCH: main
          SWIFTTERM_BUILD_TAG: "1.20.0"
          SWIFTTERM_BUILD_COMMIT: release
          SWIFTTERM_BUILD_DIRTY: "false"
        run: |
          set -o pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in data.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]]
          phones = phones or [d for runtime, ds in data.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')"
          echo "simulator: $UDID"
          status=0
          xcodebuild \
            -project Clio.xcodeproj \
            -scheme Clio \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath simbuild \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build > simbuild.log 2>&1 || status=$?
          grep -nE "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" simbuild.log | head -n 80 || true
          if [ "$status" != 0 ]; then
            grep -nB3 -A25 "Generate SwiftTerm build information" simbuild.log | tail -n 80 || true
            tail -n 40 simbuild.log
            exit "$status"
          fi
          APP="$(find simbuild/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::没有模拟器的 .app"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          mkdir -p shots
          # A first launch to warm up (the first one in a fresh simulator is slow).
          xcrun simctl launch "$UDID" io.github.lllhr94.clio -clioShot desk >/dev/null || true
          sleep 40
          if [[ "$SHOT_MODEL_ERROR" == "true" ]]; then
            xcrun simctl ui "$UDID" appearance light
            for tone in daily literary; do
              plain=NO
              if [[ "$tone" == "daily" ]]; then plain=YES; fi
              xcrun simctl launch --terminate-running-process "$UDID" io.github.lllhr94.clio -clioShot model-error -look.plainNames "$plain" >/dev/null
              sleep 20
              xcrun simctl io "$UDID" screenshot "shots/model-error-$tone.png" >/dev/null
            done
          else
            for mode in light dark; do
              xcrun simctl ui "$UDID" appearance "$mode"
              for shot in desk chat sidebar settings figures connectors look grants add pet; do
                xcrun simctl launch --terminate-running-process "$UDID" io.github.lllhr94.clio -clioShot "$shot" >/dev/null
                sleep 20
                xcrun simctl io "$UDID" screenshot "shots/$mode-$shot.png" >/dev/null
              done
            done
          fi
          ls -la shots
          # Anything that crashed while the pictures were taken, so a blank picture can be explained.
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name 'Clio*' -newer simbuild.log -exec cp {} shots/crashes/ \; 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate 'process == "Clio"' 2>/dev/null | grep -iE "fault|error|crash|terminat|assert|fatal" | tail -n 300 > shots/crashes/clio-log.txt || true
          ls -la shots/crashes

      - name: Push the screenshots to a branch of their own
        if: always() && inputs.shots
        run: |
          mkdir -p shots
          cp simbuild.log shots/ 2>/dev/null || true
          ls shots | grep -q . || exit 0
          cd shots
          git init -q -b shots
          git config user.name "clio-ci"
          git config user.email "clio-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/shots/${GITHUB_RUN_ID}"
          echo "pushed shots/${GITHUB_RUN_ID}"

      - uses: actions/upload-artifact@v4
        if: always() && inputs.shots
        with:
          name: simbuild-log
          path: App/simbuild.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always() && inputs.shots
        with:
          name: Clio-screenshots
          path: App/shots
          if-no-files-found: warn

      # A plain download link on the Releases page, so the IPA can be fetched from a phone.
      - name: Publish the IPA to the latest release
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          gh release view latest --repo "$REPO" >/dev/null 2>&1 || \
            gh release create latest --repo "$REPO" --prerelease \
              --title "Clio（未签名 IPA，最新构建）" \
              --notes "每次构建自动更新。下载 Clio-unsigned.ipa，用签名工具签名后安装。"
          # Upload under a new name first, then swap names, so the fixed link is never empty or half-written.
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release-iphoneos/Clio.app/Info.plist)"
          cp Clio-unsigned.ipa "Clio-$VERSION.ipa"
          gh release upload latest "Clio-$VERSION.ipa" --repo "$REPO" --clobber
          NEW_ID="$(gh api "repos/$REPO/releases/tags/latest" -q ".assets[] | select(.name == \"Clio-$VERSION.ipa\") | .id")"
          OLD_ID="$(gh api "repos/$REPO/releases/tags/latest" -q '.assets[] | select(.name == "Clio-unsigned.ipa") | .id')"
          if [ -n "$OLD_ID" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$OLD_ID"; fi
          gh api -X PATCH "repos/$REPO/releases/assets/$NEW_ID" -f name=Clio-unsigned.ipa >/dev/null
          # Keep this version on its own too, for going back.
          gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --repo "$REPO" --prerelease --title "Clio $VERSION" --notes "构建 ${{ github.sha }}"
          gh release upload "v$VERSION" "Clio-$VERSION.ipa" --repo "$REPO" --clobber
          gh release edit latest --repo "$REPO" --notes "最新构建：Clio $VERSION（${{ github.sha }}）。下载 Clio-unsigned.ipa，用签名工具签名后安装。每个版本也单独留在 v$VERSION 里。"

      # A probe from another branch gets its own release, so latest is never touched.
      - name: Publish a probe build
        if: inputs.publish && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="probe-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --prerelease --title "Clio 试签包（${{ github.ref_name }}）" --notes "只用来试签，不是正式版。"
          cp Clio-unsigned.ipa Clio-probe.ipa
          gh release upload "$TAG" Clio-probe.ipa --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --notes "试签包：分支 ${{ github.ref_name }}，构建 ${{ github.sha }}。只用来试签，不是正式版。"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: App/xcodebuild.log
          if-no-files-found: ignore
