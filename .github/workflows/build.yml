# Builds Clio: tests the engine (AgentKit), then the SwiftUI app (App).
# Produces an unsigned IPA; signing happens on the phone.

name: Build

# Built only when asked. A build checks that everything compiles; only a build with publish on replaces the
# latest IPA, and that happens once every task of a version is green (section 13.5 of the plan).
on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast PR check: run Lint + Chat flow + AgentKit + ClioAppTests (simulator), skip Release iphoneos build and IPA packaging"
        type: boolean
        default: false
      swiftpm_only:
        description: "Ultra-fast engine check (~1.5m): run Lint + Chat flow + AgentKit swift test only; skip Xcode/simulator/IPA"
        type: boolean
        default: false
      runner:
        description: Runner label (macos-latest, or macos-15-intel when the arm64 machines are busy)
        default: macos-latest
      publish:
        description: "Publish the IPA: on main it replaces latest/Clio-unsigned.ipa; on another branch it goes to a probe-<branch> release"
        type: boolean
        default: false
      shots:
        description: "Also build for the simulator and take screenshots of the main screens (light and dark)"
        type: boolean
        default: false
      shot_model_error:
        description: "Also capture the model error card in both tones"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Clio (iOS, unsigned)
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
        working-directory: App
    steps:
      - uses: actions/checkout@v4

      - name: Lint app sources
        working-directory: .
        run: python3 tools/lint.py

      - name: Use Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Reuse SwiftPM cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('App/project.yml', 'AgentKit/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Test chat flow rules
        working-directory: .
        run: python3 tools/test_chat_flow.py

      - name: Test the engine (AgentKit)
        working-directory: AgentKit
        run: |
          set +e
          swift test > swift-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -E "error:|failed|XCTAssert|XCTFail|Fatal error" swift-test.log | head -n 120
            echo "--- tail ---"
          fi
          tail -n 80 swift-test.log
          exit "$status"

      - name: Reuse 斗室 built before
        if: ${{ !inputs.swiftpm_only }}
        uses: actions/cache@v4
        with:
          path: |
            App/Den/build/ios
            App/Den/build/rootfs
            App/Den/ish-src
          key: den-${{ hashFiles('App/Den/build-ish.sh') }}

      - name: Build 斗室 (iSH ARM64 kernel + Alpine root)
        if: ${{ !inputs.swiftpm_only }}
        run: bash Den/build-ish.sh

      - name: Generate the Xcode project
        if: ${{ !inputs.swiftpm_only }}
        run: |
          which xcodegen || brew install xcodegen
          # Every build gets a higher build number, so an installer never mistakes a new probe for the one already on the phone.
          if [ "${{ inputs.fast }}" != "true" ]; then
            sed -i '' "s/CFBundleVersion: \"[0-9]*\"/CFBundleVersion: \"${{ github.run_number }}\"/" project.yml
          fi
          xcodegen generate

      - name: Build (no code signing)
        if: ${{ !inputs.fast && !inputs.swiftpm_only }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Clio.xcodeproj \
            -scheme Clio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -iE "error|failed|BUILD|undefined|not found" | grep -v "^\s*$" | tail -n 150

      - name: Reuse simulator DerivedData & SPM packages
        if: ${{ !inputs.swiftpm_only }}
        uses: actions/cache@v4
        with:
          path: |
            App/simtestbuild/SourcePackages
            App/simtestbuild/Build
          key: simdd-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('App/project.yml', 'AgentKit/Package.swift') }}-${{ github.run_id }}
          restore-keys: |
            simdd-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('App/project.yml', 'AgentKit/Package.swift') }}-
            simdd-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Run ClioAppTests (simulator)
        if: ${{ !inputs.swiftpm_only }}
        env:
          SWIFTTERM_BUILD_BRANCH: main
          SWIFTTERM_BUILD_TAG: "1.20.0"
          SWIFTTERM_BUILD_COMMIT: release
          SWIFTTERM_BUILD_DIRTY: "false"
        run: |
          set -o pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin).get("devices", {})
          candidates = []
          for runtime, ds in data.items():
              m = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              if ver[0] < 26:
                  continue
              for d in ds:
                  if not d.get("isAvailable", True):
                      continue
                  name = d.get("name", "")
                  if name.startswith("iPhone"):
                      is_pro = 1 if ("Pro" in name and "Max" not in name) else 0
                      candidates.append((ver, is_pro, name, d["udid"]))
          if not candidates:
              raise SystemExit("No available iOS >= 26 iPhone simulator found")
          candidates.sort()
          print(candidates[-1][3])
          ')"
          echo "ClioAppTests simulator: $UDID"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 &
          rm -rf simtestbuild.xcresult simtestbuild.log simtest-summary.json simtest-tests.json
          set +e
          xcodebuild \
            -project Clio.xcodeproj \
            -scheme Clio \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath simtestbuild \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing > simtestbuild.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            xcrun simctl bootstatus "$UDID" -b
            xcodebuild \
              -project Clio.xcodeproj \
              -scheme Clio \
              -configuration Debug \
              -destination "id=$UDID" \
              -only-testing:ClioAppTests \
              -derivedDataPath simtestbuild \
              -resultBundlePath simtestbuild.xcresult \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO \
              test-without-building >> simtestbuild.log 2>&1
            status=$?
          fi
          grep -E "Test Suite |Test Case |Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)" simtestbuild.log || true
          if [ "$status" -eq 0 ] && ! grep -q "Test Suite 'ClioAppTests.xctest' passed" simtestbuild.log; then
            echo "::error::ClioAppTests.xctest did not report passing in simtestbuild.log"
            status=1
          fi
          if [ "$status" -eq 0 ] && [ ! -d simtestbuild.xcresult ]; then
            echo "::error::simtestbuild.xcresult missing"
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            xcrun xcresulttool get test-results summary --path simtestbuild.xcresult > simtest-summary.json
            sum_rc=$?
            xcrun xcresulttool get test-results tests --path simtestbuild.xcresult > simtest-tests.json
            tests_rc=$?
            if [ "$sum_rc" -ne 0 ] || [ "$tests_rc" -ne 0 ]; then
              echo "::error::xcresulttool exited with summary=$sum_rc tests=$tests_rc"
              status=1
            fi
          fi
          if [ "$status" -eq 0 ]; then
            python3 - <<'PY'
          import json
          summary = json.load(open("simtest-summary.json", encoding="utf-8"))
          failed = summary.get("failedTests", -1)
          skipped = summary.get("skippedTests", -1)
          passed = summary.get("passedTests", 0)
          print(f"xcresult summary: passed={passed}, failed={failed}, skipped={skipped}")
          if failed != 0 or skipped != 0 or passed < 4:
              raise SystemExit(f"Expected >=4 passed, 0 failed, 0 skipped tests, got passed={passed} failed={failed} skipped={skipped}")
          tests_doc = json.load(open("simtest-tests.json", encoding="utf-8"))
          test_nodes = tests_doc.get("testNodes")
          if not isinstance(test_nodes, list):
              raise SystemExit(f"Unexpected xcresulttool test-results tests keys: {list(tests_doc.keys())}")
          passed_cases = set()
          def walk(node, in_pr1a):
              if isinstance(node, dict):
                  name = node.get("name", "")
                  node_type = node.get("nodeType", "")
                  result = node.get("result", "")
                  next_in_pr1a = in_pr1a or name == "ClioAppPR1ATests" or name.endswith(".ClioAppPR1ATests")
                  if next_in_pr1a and node_type == "Test Case" and result == "Passed" and name:
                      passed_cases.add(name)
                  for child in node.get("children", []):
                      walk(child, next_in_pr1a)
              elif isinstance(node, list):
                  for item in node:
                      walk(item, in_pr1a)
          walk(test_nodes, False)
          required = [
              "testBackupStripsMountsAndUnionsTombstonesIntoMemoryAndExperiences",
              "testBackupBarrierRunsOnExperienceQueueAndPropagatesErrors",
              "testColdStartRollsBackJournalAndRebuildsMemoryProjection",
              "testDoubleCorruptMemoryKeepsProjectionAndMarker",
              "testExperienceBridgeUsesLiveTombstonesAndHonorsPolicyAndFreeze",
              "testLivePromptProviderRedactsSystemAndCachePrefixOnUpstreamRequest",
              "testReadOnlyTeamDirectoryPreservesCanonicalAndRecoveryMarker",
              "testRecallMergesWithSameEpochRemember",
              "testSnapshotRestoreRejectsStaleEpochAndPreservesRecoveryAcrossRelaunch",
              "testTeamModelExperienceSourceGatingZeroWriteRecallReadOnlyAndProcessedDedupe",
          ]
          missing = [r for r in required if not any(n == r or n.startswith(r + "(") for n in passed_cases)]
          if missing:
              print("Passed ClioAppPR1ATests cases:", sorted(passed_cases))
              raise SystemExit(f"Required ClioAppPR1ATests missing or not Passed: {missing}")
          PY
            rc=$?
            if [ "$rc" -ne 0 ]; then
              status=$rc
            fi
          fi
          if [ "$status" -ne 0 ]; then
            grep -n -E "error:|failed|XCTAssert|XCTFail|Fatal error|Testing failed|BUILD FAILED" simtestbuild.log | head -n 120 || true
            echo "--- simtest tail ---"
            tail -n 60 simtestbuild.log || true
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: ci-failure-logs
          path: |
            AgentKit/swift-test.log
            App/simtestbuild.log
            App/simtestbuild.xcresult
            App/xcodebuild.log
          if-no-files-found: ignore

      - name: Package the IPA
        if: ${{ !inputs.fast && !inputs.swiftpm_only }}
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::没有找到 .app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCalendarsFullAccessUsageDescription' "$APP/Info.plist"
          test -f "$APP/alpine/meta.db" || { echo "::error::斗室的 Linux 没有打进包里"; exit 1; }
          du -sh "$APP" "$APP/alpine"
          # A probe branch can carry entitlements (App/Clio.entitlements, App/ClioWidget.entitlements); sign ad hoc so they
          # travel inside the binaries. Extensions first, each with its own, then the app around them.
          if [ -f ClioWidget.entitlements ] && [ -d "$APP/PlugIns/ClioWidget.appex" ]; then
            codesign --force --sign - --entitlements ClioWidget.entitlements --timestamp=none "$APP/PlugIns/ClioWidget.appex"
          fi
          if [ -f Clio.entitlements ]; then
            codesign --force --sign - --entitlements Clio.entitlements --timestamp=none "$APP"
            codesign -d --entitlements - "$APP" || true
          fi
          ls "$APP/PlugIns" 2>/dev/null || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Clio-unsigned.ipa Payload
          ls -lh Clio-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.fast && !inputs.swiftpm_only }}
        with:
          name: Clio-unsigned-ipa
          path: App/Clio-unsigned.ipa
          if-no-files-found: error

      # Pictures of the main screens, to check the look without a phone.
      - name: Publish a probe build
        if: ${{ !inputs.fast && !inputs.swiftpm_only && inputs.publish && github.ref != 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="probe-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --prerelease --title "Clio 试签包（${{ github.ref_name }}）" --notes "只用来试签，不是正式版。"
          cp Clio-unsigned.ipa Clio-probe.ipa
          gh release upload "$TAG" Clio-probe.ipa --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --notes "试签包：分支 ${{ github.ref_name }}，构建 ${{ github.sha }}。只用来试签，不是正式版。"

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && !inputs.fast && !inputs.swiftpm_only }}
        with:
          name: xcodebuild-log
          path: App/xcodebuild.log
          if-no-files-found: ignore
      - name: Screenshots (simulator)
        if: ${{ inputs.shots && !inputs.swiftpm_only }}
        # A failed picture is reported, but must not hold back the rest.
        continue-on-error: true
        timeout-minutes: 55
        env:
          SHOT_MODEL_ERROR: ${{ inputs.shot_model_error }}
          SWIFTTERM_BUILD_BRANCH: main
          SWIFTTERM_BUILD_TAG: "1.20.0"
          SWIFTTERM_BUILD_COMMIT: release
          SWIFTTERM_BUILD_DIRTY: "false"
        run: |
          set -o pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin).get("devices", {})
          candidates = []
          for runtime, ds in data.items():
              m = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              if ver[0] < 26:
                  continue
              for d in ds:
                  if not d.get("isAvailable", True):
                      continue
                  name = d.get("name", "")
                  if name.startswith("iPhone"):
                      is_pro = 1 if ("Pro" in name and "Max" not in name) else 0
                      candidates.append((ver, is_pro, name, d["udid"]))
          if not candidates:
              raise SystemExit("No available iOS >= 26 iPhone simulator found")
          candidates.sort()
          print(candidates[-1][3])
          ')"
          echo "simulator: $UDID"
          status=0
          xcodebuild \
            -project Clio.xcodeproj \
            -scheme Clio \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath simbuild \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build > simbuild.log 2>&1 || status=$?
          grep -nE "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" simbuild.log | head -n 80 || true
          if [ "$status" != 0 ]; then
            grep -nB3 -A25 "Generate SwiftTerm build information" simbuild.log | tail -n 80 || true
            tail -n 40 simbuild.log
            exit "$status"
          fi
          APP="$(find simbuild/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::没有模拟器的 .app"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          mkdir -p shots
          xcrun swiftc ../tools/check_ci_screenshot.swift -o /tmp/clio-check-screenshot
          BUNDLE=io.github.lllhr94.clio
          DATA_DIR="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)"

          capture() {
            local shot="$1" output="$2" token elapsed attempt
            shift 2
            for attempt in 1 2; do
              token="$(uuidgen)"
              if xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" -clioShot "$shot" -clioShotToken "$token" "$@" >/dev/null; then
                for ((elapsed=0; elapsed<90; elapsed++)); do
                  if [[ "$(cat "$DATA_DIR/tmp/clio-shot-ready" 2>/dev/null || true)" == "$token" ]] &&
                     xcrun simctl io "$UDID" screenshot "$output" >/dev/null &&
                     /tmp/clio-check-screenshot "$output"; then
                    return 0
                  fi
                  sleep 1
                done
              fi
              echo "::warning::Screenshot attempt $attempt failed for $output"
            done
            rm -f "$output"
            echo "::error::Could not capture a rendered screen for $output"
            return 1
          }

          status=0
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            for shot in desk chat sidebar settings connectors look grants add pet; do
              capture "$shot" "shots/$mode-$shot.png" || status=1
            done
          done
          # The conversation as it is used: long, jumped back to its foot, with a reply arriving; dark, pure black and
          # large text. Each waits a little after it first draws (clioShotDelay) so what it does has happened.
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            capture chat-long "shots/$mode-chat-long.png" -clioShotDelay 1.5 || status=1
            capture chat-latest "shots/$mode-chat-latest.png" -clioShotDelay 3.5 || status=1
            capture chat-stream "shots/$mode-chat-stream.png" -clioShotDelay 2.6 || status=1
            capture chat-stream "shots/$mode-chat-stream-midway.png" -clioShotStream midway -clioShotDelay 2.6 || status=1
            capture chat-stream "shots/$mode-chat-stream-finished.png" -clioShotStream finished -clioShotDelay 2.6 || status=1
            for shot in stops newchat sidebar-past; do
              capture "$shot" "shots/$mode-$shot.png" -clioShotDelay 2.2 || status=1
            done
          done
          xcrun simctl ui "$UDID" appearance dark
          capture chat-long shots/oled-chat-long.png -clioShotDelay 1.5 -look.oled YES || status=1
          capture settings shots/oled-settings.png -look.oled YES || status=1
          xcrun simctl ui "$UDID" appearance light
          capture chat-long shots/large-chat-long.png -clioShotDelay 1.5 -look.typeset4 YES -look.size 21 -look.ui 1.08 || status=1
          capture settings shots/large-settings.png -look.ui 1.08 || status=1

          for shot in stops newchat sidebar-past; do
            capture "$shot" "shots/large-$shot.png" -clioShotDelay 2.2 -look.typeset4 YES -look.size 24 -look.ui 1.20 -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityXXXL || status=1
          done

          # A small phone (iPhone SE width, 375 points), if this Xcode has one.
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("platform")=="iOS" and x.get("isAvailable")]; print(r[-1]["identifier"] if r else "")')"
          SMALL="$(xcrun simctl create clio-small com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$RUNTIME" 2>/dev/null || true)"
          if [[ -n "$SMALL" ]]; then
            xcrun simctl shutdown "$UDID" || true
            UDID="$SMALL"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            DATA_DIR="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)"
            xcrun simctl ui "$UDID" appearance light
            for shot in desk chat-long settings; do
              capture "$shot" "shots/small-$shot.png" -clioShotDelay 1 || status=1
            done
          else
            echo "::warning::No iPhone SE simulator here; small-screen pictures skipped"
          fi

          if [[ "$SHOT_MODEL_ERROR" == "true" ]]; then
            xcrun simctl ui "$UDID" appearance light
            capture model-error shots/model-error-daily.png -look.plainNames YES || status=1
            capture model-error shots/model-error-literary.png -look.plainNames NO || status=1
          fi
          ls -la shots
          # Anything that crashed while the pictures were taken, so a blank picture can be explained.
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name 'Clio*' -newer simbuild.log -exec cp {} shots/crashes/ \; 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate 'process == "Clio"' 2>/dev/null | grep -iE "fault|error|crash|terminat|assert|fatal" | tail -n 300 > shots/crashes/clio-log.txt || true
          ls -la shots/crashes
          exit "$status"

      - name: Push the screenshots to a branch of their own
        if: always() && inputs.shots
        run: |
          mkdir -p shots
          ls shots | grep -q . || exit 0
          cd shots
          # Smaller pictures push reliably (full-size PNGs timed out at 408): JPEG, 1000 points wide, enough to judge by.
          for f in $(find . -name '*.png'); do
            sips -s format jpeg -s formatOptions 80 -Z 1400 "$f" --out "${f%.png}.jpg" >/dev/null 2>&1 && rm -f "$f"
          done
          git init -q -b shots
          git config user.name "clio-ci"
          git config user.email "clio-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            if git push -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/shots/${GITHUB_RUN_ID}"; then
              echo "pushed shots/${GITHUB_RUN_ID}"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always() && inputs.shots
        with:
          name: simbuild-log
          path: App/simbuild.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always() && inputs.shots
        with:
          name: Clio-screenshots
          path: App/shots
          if-no-files-found: warn

      # A plain download link on the Releases page, so the IPA can be fetched from a phone.
      - name: Publish the IPA to the latest release
        if: ${{ !inputs.fast && !inputs.swiftpm_only && inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          gh release view latest --repo "$REPO" >/dev/null 2>&1 || \
            gh release create latest --repo "$REPO" --prerelease \
              --title "Clio（未签名 IPA，最新构建）" \
              --notes "每次构建自动更新。下载 Clio-unsigned.ipa，用签名工具签名后安装。"
          # Upload under a new name first, then swap names, so the fixed link is never empty or half-written.
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release-iphoneos/Clio.app/Info.plist)"
          cp Clio-unsigned.ipa "Clio-$VERSION.ipa"
          gh release upload latest "Clio-$VERSION.ipa" --repo "$REPO" --clobber
          NEW_ID="$(gh api "repos/$REPO/releases/tags/latest" -q ".assets[] | select(.name == \"Clio-$VERSION.ipa\") | .id")"
          OLD_ID="$(gh api "repos/$REPO/releases/tags/latest" -q '.assets[] | select(.name == "Clio-unsigned.ipa") | .id')"
          if [ -n "$OLD_ID" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$OLD_ID"; fi
          gh api -X PATCH "repos/$REPO/releases/assets/$NEW_ID" -f name=Clio-unsigned.ipa >/dev/null
