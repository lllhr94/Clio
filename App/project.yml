name: Clio
options:
  bundleIdPrefix: io.github.lllhr94
  # Chinese first: Siri reads the app's shortcut phrases in this language.
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
packages:
  AgentKit:
    path: ../AgentKit
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.9.2
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  SwiftNIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    minorVersion: 0.3.4
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: 2.65.0
targets:
  Clio:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: Den
        excludes: ["ish-src", "ish-src/**", "build", "build/**", "*.sh", "DenKernel.m"]
      - path: Den/DenKernel.m
        compilerFlags: "-DGUEST_ARM64=1 -DENGINE_ASBESTOS=1 -std=gnu11 -I$(SRCROOT)/Den/ish-src -I$(SRCROOT)/Den/build/ios -Wno-everything"
      - path: Den/build/rootfs/alpine
        type: folder
        buildPhase: resources
    dependencies:
      - target: ClioWidget
      - package: AgentKit
        product: AgentKit
      - package: AgentKit
        product: Prose
      - package: AgentKit
        product: Craft
      - package: Citadel
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftTerm
      - package: SwiftMath
      - package: SwiftNIOSSH
        product: NIOSSH
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Clio
        CFBundleShortVersionString: "0.29"
        CFBundleVersion: "31"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 拍照发给旅伴看。
        NSMicrophoneUsageDescription: 按下说话时，用麦克风听你说的话。
        NSSpeechRecognitionUsageDescription: 把你说的话转成文字，发给旅伴。
        NSCalendarsFullAccessUsageDescription: 旅伴帮你查日程、加日程（加之前会问你）。
        NSRemindersFullAccessUsageDescription: 旅伴帮你查提醒事项、加提醒（加之前会问你）。
        NSPhotoLibraryAddUsageDescription: 保存旅伴给你的图片和笺。
        NSPhotoLibraryUsageDescription: 在加号里显示最近的照片，点一下就能发给旅伴；你允许时，旅伴也可以看相册里最近照片的时间和地点。
        NSLocationWhenInUseUsageDescription: 你问附近、天气、路线时，旅伴用它知道你大概在哪。
        NSContactsUsageDescription: 你允许时，旅伴可以按名字查通讯录里的人。
        NSFaceIDUsageDescription: 看或复制信匣里的密码前，先确认是你本人。
        NSMotionUsageDescription: 你允许时，旅伴可以读手机记的步数。
        NSHealthShareUsageDescription: 你允许时，旅伴可以读「健康」里的步数、睡眠、心率、活动能量和体重。Clio 只读不写。
        NSHealthUpdateUsageDescription: Clio 不会往「健康」里写任何东西。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: io.github.lllhr94.clio
            CFBundleURLSchemes: [clio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lllhr94.clio
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Rose AppIcon-Mint AppIcon-Honey AppIcon-Lilac AppIcon-Night"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: Den/Clio-Bridging-Header.h
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/Den/build/ios/libish.a
          - $(SRCROOT)/Den/build/ios/libish_emu.a
          - $(SRCROOT)/Den/build/ios/libfakefs.a
          - -lsqlite3
          - -lresolv
  ClioWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: ClioWidget-Info.plist
      properties:
        CFBundleDisplayName: Clio
        CFBundleShortVersionString: "0.29"
        CFBundleVersion: "31"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lllhr94.clio.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        SKIP_INSTALL: "YES"
