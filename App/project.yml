name: Clio
options:
  bundleIdPrefix: io.github.lllhr94
  # Chinese first: Siri reads the app's shortcut phrases in this language.
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
packages:
  AgentKit:
    path: ../AgentKit
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  SwiftNIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    exactVersion: 0.3.7
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    from: 2.65.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
targets:
  Clio:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["**/*.md"]
      - Shared
      - path: Den
        excludes: ["ish-src", "ish-src/**", "build", "build/**", "*.sh", "DenKernel.m"]
      - path: Den/DenKernel.m
        compilerFlags: "-DGUEST_ARM64=1 -DENGINE_ASBESTOS=1 -std=gnu11 -I$(SRCROOT)/Den/ish-src -I$(SRCROOT)/Den/build/ios -Wno-everything"
      - path: Den/build/rootfs/alpine
        type: folder
        buildPhase: resources
      - path: Pets
        type: folder
        buildPhase: resources
      - path: Fonts
        buildPhase: resources
        excludes: ["*.md"]
      - path: Resources
        buildPhase: resources
        excludes: ["*.md"]
    dependencies:
      - target: ClioWidget
      - package: AgentKit
        product: AgentKit
      - package: AgentKit
        product: Prose
      - package: AgentKit
        product: Craft
      - package: Citadel
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftTerm
      - package: SwiftMath
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: ZIPFoundation
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Clio
        UIBackgroundModes: [audio, processing]
        CFBundleShortVersionString: "0.37"
        CFBundleVersion: "37"
        UILaunchScreen: {}
        UIAppFonts: [ClioKai-Regular.ttf, ClioKai-Medium.ttf, ClioSeal-Regular.ttf, MapleMono-Regular.ttf, MapleMono-SemiBold.ttf, ClioMonoCN-Regular.ttf]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: 文件
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data, public.content, public.item]
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: 当你点击拍照发送时，Clio 使用相机拍摄照片并发送给你在对话中选择的模型或工具。
        NSMicrophoneUsageDescription: 当你按住语音输入按钮时，Clio 使用麦克风采集你的语音以便转写或对话。
        NSSpeechRecognitionUsageDescription: 当你使用语音输入时，Clio 使用系统的语音识别服务将你的语音转成文字并填入输入框。
        NSCalendarsFullAccessUsageDescription: 当你要求查询、新增或修改日程时，Clio 会读写你的系统日历；任何修改操作前都会先请你确认。
        NSRemindersFullAccessUsageDescription: 当你要求查看、创建或完成待办提醒时，Clio 会读写你的提醒事项；任何修改操作前都会先请你确认。
        NSPhotoLibraryAddUsageDescription: 当你主动点击保存图片或导出卡片时，Clio 会将生成或查看的图片写入你的系统相册。
        NSPhotoLibraryUsageDescription: 当你打开图片选择器发送照片时，Clio 会读取你选中的相册图片；仅在你明确授权时才会查看最近照片的时间与地点元数据。
        NSLocationWhenInUseUsageDescription: 当你主动询问天气、周边或路线规划并请求查询位置时，Clio 仅在使用期间读取当前位置以回答你的问题。
        NSContactsUsageDescription: 当你明确要求查找联系人信息并授权后，Clio 会按你的查询读取系统通讯录。
        NSFaceIDUsageDescription: 当你解锁应用或查看、复制信匣中的敏感凭据与密钥前，Clio 使用面容 ID 验证你的本人身份。
        BGTaskSchedulerPermittedIdentifiers: [io.github.lllhr94.clio.turn.*, io.github.lllhr94.clio.memory-night]
        NSLocalNetworkUsageDescription: 当你在设置中连接同一 Wi-Fi 下的本地模型或工具服务（例如 Ollama、LM Studio）时，Clio 需要访问本地网络以建立连接。
        NSMotionUsageDescription: 当你明确要求读取活动数据时，Clio 会在你授权后读取设备的计步与运动摘要，不会向外部自动上传。
        NSHealthShareUsageDescription: 当你明确授权后，Clio 仅读取你允许的健康数据（步数、睡眠、心率、活动能量与体重）用于对话回答，不会主动写入。
        NSHealthUpdateUsageDescription: Clio 仅请求只读权限，不会向系统「健康」写入任何记录。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: io.github.lllhr94.clio
            CFBundleURLSchemes: [clio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lllhr94.clio
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: Den/Clio-Bridging-Header.h
        OTHER_LDFLAGS:
          - $(inherited)
          - $(SRCROOT)/Den/build/ios/libish.a
          - $(SRCROOT)/Den/build/ios/libish_emu.a
          - $(SRCROOT)/Den/build/ios/libfakefs.a
          - -lsqlite3
          - -lresolv
        # Screenshots run in the simulator, where the iSH kernel (built for iPhones) can't link: a stand-in instead.
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - $(inherited)
          - -lsqlite3
          - -lresolv
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]": DenKernel.m
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphoneos*]": DenKernelStub.m
  ClioAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Clio
      - package: AgentKit
        product: AgentKit
      - package: AgentKit
        product: Prose
      - package: AgentKit
        product: Craft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lllhr94.clio.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Clio.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Clio"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ClioWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: ClioWidget-Info.plist
      properties:
        CFBundleDisplayName: Clio
        CFBundleShortVersionString: "0.37"
        CFBundleVersion: "37"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lllhr94.clio.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        SKIP_INSTALL: "YES"
schemes:
  Clio:
    build:
      targets:
        Clio: all
        ClioWidget: all
        ClioAppTests: [test]
    test:
      targets:
        - ClioAppTests
